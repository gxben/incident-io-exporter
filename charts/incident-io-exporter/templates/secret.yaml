{{- if not .Values.incidentio.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incident-io-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "incident-io-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "incidentio.apiKey is required when not using incidentio.existingSecret" .Values.incidentio.apiKey | quote }}
{{- end }}
