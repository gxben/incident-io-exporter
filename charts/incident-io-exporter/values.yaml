replicaCount: 1

image:
  repository: ghcr.io/gxben/incident-io-exporter
  pullPolicy: IfNotPresent
  # Overrides the image tag; defaults to the chart's appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# incident.io API configuration
incidentio:
  # Provide apiKey directly (stored in a Secret created by this chart).
  # Prefer existingSecret when managing secrets externally (e.g. External Secrets Operator).
  # A read-only key is enough: the exporter only lists resources.
  apiKey: ""

  # Use a pre-existing Secret instead of creating one.
  # The Secret must contain the key set in existingSecretKey.
  existingSecret: ""
  existingSecretKey: "api-key"

  # incident.io API base URL. Leave empty for https://api.incident.io.
  apiURL: ""

  # The exporter polls the API in the background and serves the last good
  # snapshot: scrapes never call the API, whatever their interval.
  # Incidents, alerts, escalations, on-call, maintenance windows:
  pollInterval: "60s"
  # Users, teams, severities, alert sources, escalation paths, follow-ups:
  slowPollInterval: "10m"
  # Upper bound for one source's poll, pagination and retries included.
  pollTimeout: "2m"

  # Client-side API budget (requests per second, token bucket). incident.io
  # allows 1200 requests per minute per API key; keep well below to leave room
  # for other integrations sharing the key. 0 disables the limiter.
  rateLimit: 2
  rateBurst: 5
  # Retries on network errors, 429 and 5xx, with exponential backoff; a
  # Retry-After header is honoured.
  maxRetries: 4
  requestTimeout: "30s"

  # Sources not to poll: alert_sources, escalation_paths, teams, severities,
  # users, follow_ups, incidents, alerts, escalations, oncall,
  # maintenance_windows.
  disableSources: []

logLevel: info

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9429"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 9429
  annotations: {}

# Prometheus Operator ServiceMonitor
serviceMonitor:
  enabled: false
  namespace: ""
  # Scrapes only read the exporter's cached snapshot: short values are fine.
  interval: "60s"
  scrapeTimeout: "10s"
  labels: {}
  relabelings: []
  metricRelabelings: []

# Prometheus Operator PrometheusRule
prometheusRule:
  enabled: false
  namespace: ""
  labels: {}
  additionalLabels: {}
  rules:
    - alert: IncidentIOExporterStale
      expr: time() - incidentio_source_last_success_timestamp_seconds > 900
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "incident.io exporter: {{ $labels.source }} data is stale"
        description: "The {{ $labels.source }} source hasn't been polled successfully for more than 15 minutes."
    - alert: IncidentIOHeartbeatExpired
      expr: incidentio_heartbeat_expired == 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "incident.io heartbeat {{ $labels.alert_source }} has expired"
        description: "Heartbeat alert source {{ $labels.alert_source }} has a firing alert: it missed its pings."
    - alert: IncidentIOEscalationNotAcknowledged
      expr: time() - incidentio_escalation_created_timestamp_seconds{status="triggered"} > 900
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: "Page \"{{ $labels.title }}\" not acknowledged for 15 minutes"
        description: "Escalation {{ $labels.escalation_id }} on path {{ $labels.escalation_path }} has been triggered for more than 15 minutes without acknowledgement."
    - alert: IncidentIONoOnCallUser
      expr: incidentio_schedule_oncall_users == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "No user on call for schedule {{ $labels.schedule_name }}"
        description: "incident.io schedule {{ $labels.schedule_name }} has nobody on call."

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: incident-io-exporter.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables injected into the container
extraEnv: []
# - name: FOO
#   value: bar

# Extra volumes / mounts
extraVolumes: []
extraVolumeMounts: []
